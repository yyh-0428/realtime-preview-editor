    const editorPanel = document.getElementById('editorPanel');
    const previewPanel = document.getElementById('previewPanel');
    const mainContent = document.getElementById('mainContent');
    const dragOverlay = document.getElementById('dragOverlay');
    const previewContainer = document.getElementById('previewContainer');
    const languageSelect = document.getElementById('languageSelect');
    const currentFileButton = document.getElementById('currentFileButton');
    const currentFileLabel = document.getElementById('currentFileLabel');
    const currentFileExtension = document.getElementById('currentFileExtension');
    const currentFileInput = document.getElementById('currentFileInput');
    const documentSaveIndicator = document.getElementById('documentSaveIndicator');
    const documentMetrics = document.getElementById('documentMetrics');
    const formatDetectionBadge = document.getElementById('formatDetectionBadge');
    const previewSubtitle = document.getElementById('previewSubtitle');

    // ==================== CodeMirror 5 ====================
    const editor = CodeMirror(editorContainer, {
        value: '',
        mode: 'htmlmixed',
        theme: 'default',
        lineNumbers: true,
        lineWrapping: true,
        matchBrackets: true,
        autoCloseTags: true,
        autoCloseBrackets: true,
        tabSize: 2,
        indentUnit: 2,
        indentWithTabs: false,
        extraKeys: {
            'Tab': function(cm) {
                if (cm.somethingSelected()) { cm.indentSelection('add'); }
                else { cm.replaceSelection('  ', 'end'); }
            },
            'Shift-Tab': function(cm) { cm.indentSelection('subtract'); }
        }
    });

    function getCode() { return editor.getValue(); }
    function setCode(val) { editor.setValue(val); }

    function getEditorContext() {
        const cursor = editor.getCursor();
        const selections = editor.listSelections();
        const totalLines = editor.lineCount();
        let ctx = '';
        if (selections && selections.length > 0) {
            const s = selections[0];
            const from = { line: Math.min(s.anchor.line, s.head.line), ch: Math.min(s.anchor.ch, s.head.ch) };
            const to = { line: Math.max(s.anchor.line, s.head.line), ch: Math.max(s.anchor.ch, s.head.ch) };
            if (from.line !== to.line || from.ch !== to.ch) {
                const selectedText = editor.getRange(from, to);
                const snippet = selectedText.slice(0, 600) + (selectedText.length > 600 ? '\n...' : '');
                // Analyze structural context: find enclosing function/class/tag
                const structCtx = getStructuralContext(from.line, to.line);
                // Get surrounding context (3 lines before and after)
                let surrounding = '';
                const preStart = Math.max(0, from.line - 3);
                const postEnd = Math.min(totalLines - 1, to.line + 3);
                if (preStart < from.line || postEnd > to.line) {
                    const surLines = [];
                    for (let i = preStart; i <= postEnd; i++) {
                        const ln = editor.getLine(i);
                        const prefix = i >= from.line && i <= to.line ? '▶' : ' ';
                        surLines.push('  ' + (i + 1) + ' |' + prefix + ' ' + ln.slice(0, 120));
                    }
                    surrounding = '\n\n选中区域周边代码（▶ 标记的是选中行）：\n```\n' + surLines.join('\n') + '\n```';
                }
                ctx = '\n用户当前选中了第 ' + (from.line + 1) + ' 行到第 ' + (to.line + 1) + ' 行' +
                      (structCtx ? '（位于 ' + structCtx + ' 内）' : '') +
                      '，选中内容：\n```\n' + snippet + '\n```' + surrounding +
                      '\n\n【重要】你只修改这段选中区域内的代码，不要改动选中区域之外的任何代码。';
            } else {
                // Cursor at specific position — show surrounding context too
                const structCtx = getStructuralContext(cursor.line, cursor.line);
                const curLineText = editor.getLine(cursor.line);
                const surLines = [];
                for (let i = Math.max(0, cursor.line - 3); i <= Math.min(totalLines - 1, cursor.line + 3); i++) {
                    const ln = editor.getLine(i);
                    const prefix = i === cursor.line ? '▶' : ' ';
                    surLines.push('  ' + (i + 1) + ' |' + prefix + ' ' + ln.slice(0, 120));
                }
                ctx = '\n用户光标当前在第 ' + (cursor.line + 1) + ' 行第 ' + (cursor.ch + 1) + ' 列' +
                      (structCtx ? '（位于 ' + structCtx + ' 内）' : '') +
                      '，当前行内容：`' + curLineText.slice(0, 200) + '`\n\n周边代码上下文（▶ 标记的是当前行）：\n```\n' + surLines.join('\n') + '\n```';
            }
        } else {
            // No cursor position available
            ctx = '\n编辑器当前共 ' + totalLines + ' 行代码，用户未选中特定区域。';
        }
        return ctx;
    }

    function getStructuralContext(startLine, endLine) {
        const code = getCode();
        const lines = code.split('\n');
        const contexts = [];
        // Scan upward from startLine to find enclosing structures
        for (let i = startLine; i >= 0 && i >= startLine - 50; i--) {
            const line = lines[i] || '';
            // JavaScript function
            const fnMatch = line.match(/function\s+(\w+)\s*\(/);
            if (fnMatch) { contexts.push('函数 ' + fnMatch[1] + '()'); break; }
            // JavaScript arrow/const function
            const constFnMatch = line.match(/(?:const|let|var)\s+(\w+)\s*=\s*(?:\([^)]*\)\s*=>|function\s*\([^)]*\))/);
            if (constFnMatch) { contexts.push('函数 ' + constFnMatch[1] + '()'); break; }
            // JavaScript class
            const clsMatch = line.match(/class\s+(\w+)/);
            if (clsMatch) { contexts.push('类 ' + clsMatch[1]); break; }
            // HTML tag (opening)
            const tagMatch = line.match(/<([a-zA-Z][a-zA-Z0-9]*)[^>]*>/);
            if (tagMatch && !line.match(/<\//)) { contexts.push('<' + tagMatch[1] + '> 标签'); break; }
            // CSS selector
            const cssMatch = line.match(/^\s*([.#][a-zA-Z0-9_-]+\s*(?:,[\s\n]*[.#][a-zA-Z0-9_-]+\s*)*)\{/);
            if (cssMatch) { contexts.push('CSS 规则 ' + cssMatch[1].trim()); break; }
        }
        if (contexts.length === 0) return '';
        return contexts.join(' → ');
    }

    // ==================== AI Focus Highlight ====================
    let aiFocusMarks = [];
    function highlightSelectionForAi() {
        clearAiSelectionHighlight();
        const selections = editor.listSelections();
        if (!selections || selections.length === 0) return;
        const s = selections[0];
        const from = { line: Math.min(s.anchor.line, s.head.line), ch: Math.min(s.anchor.ch, s.head.ch) };
        const to = { line: Math.max(s.anchor.line, s.head.line), ch: Math.max(s.anchor.ch, s.head.ch) };
        if (from.line === to.line && from.ch === to.ch) {
            // No selection, highlight current line
            from.ch = 0; to.ch = editor.getLine(to.line).length;
        }
        const mark = editor.markText(from, to, {
            className: 'cm-ai-focus',
            inclusiveLeft: true,
            inclusiveRight: true
        });
        aiFocusMarks.push(mark);
    }
    function clearAiSelectionHighlight() {
        aiFocusMarks.forEach(m => m.clear());
        aiFocusMarks = [];
    }

    // ==================== Config ====================
    const CODE_STORAGE_KEY = 'editor_code';
    const DEBOUNCE_DELAY = 350;
    const PREVIEW_DEBOUNCE_DELAY = 400;
    const SAVE_DELAY = 1000;
    let debounceTimer = null;
    let previewDebounceTimer = null;
    let saveTimer = null;
    let highlightTimer = null;
    let highlightedLines = [];

    const defaultCode = '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <style>\n    :root { --c: #D4845A; }\n    body { margin:0; height:100dvh; display:grid; place-items:center; background:#F7F5F2; font-family:system-ui; }\n    .card { text-align:center; padding:2rem 3rem; background:#fff; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.06); }\n    h1 { margin:0; font-size:1.5rem; color:#2D2822; }\n    p { color:#9B948C; font-size:.85rem; margin-bottom:2rem; }\n    #n { font-size:4rem; font-weight:700; color:var(--c); line-height:1; margin-bottom:1.5rem; transition:transform .1s ease; }\n    button { border:none; padding:.6rem 1.5rem; border-radius:6px; font-size:.9rem; font-weight:600; cursor:pointer; transition:background-color .15s ease, color .15s ease, transform .15s ease, filter .15s ease; }\n    .add { background:var(--c); color:#fff; }\n    .add:hover { filter:brightness(1.1); transform:translateY(-1px); }\n    .rst { background:#eee; color:#666; margin-left:.5rem; }\n    .rst:hover { background:#ddd; }\n  </style>\n</head>\n<body>\n  <div class="card">\n    <h1>Werkstatt</h1>\n    <p>左侧修改代码，右侧实时预览</p>\n    <div id="n">0</div>\n    <button class="add" onclick="upd(1)">+1</button>\n    <button class="rst" onclick="upd(-c)">重置</button>\n  </div>\n  <script>\n    let c = 0;\n    function upd(v) { c += v; n.textContent = c; n.style.transform = \'scale(1.15)\'; setTimeout(() => n.style.transform = \'\', 100); }\n  <\/script>\n</body>\n</html>';

    function loadEditorCode() {
        try {
            const key = getStorageKey(currentLang);
            const saved = safeStorage.get(key);
            if (saved && saved.trim()) return saved;
            if (currentLang === 'html') {
                const legacy = safeStorage.get(CODE_STORAGE_KEY);
                if (legacy && legacy.trim()) return legacy;
            }
            return null;
        } catch (e) { return null; }
    }

    function saveEditorCode() {
        try {
            const code = getCode();
            const key = getStorageKey(currentLang);
            if (code && code.trim() !== defaultCode.trim()) {
                safeStorage.set(key, code);
            } else {
                safeStorage.remove(key);
            }
            safeStorage.set(FILE_NAME_PREFIX + currentLang, currentFileName);
            rebuildLangTabs();
            setDocumentSaveState('saved');
        } catch (e) { console.error(e); }
    }

    // ==================== Resize ====================
    const RATIO_STORAGE_KEY = 'editor-preview-ratio';
    const MIN_RATIO = 0.15;
    const MAX_RATIO = 0.85;
    let editorRatio = 0.5;
    let isDragging = false;
    let startRatio = 0;
    let totalSize = 0;
    let startCoord = 0;
    let dragDirection = 'horizontal';

    function loadRatio() {
        try {
            const saved = safeStorage.get(RATIO_STORAGE_KEY);
            if (saved !== null) {
                const parsed = parseFloat(saved);
                if (!isNaN(parsed) && parsed >= MIN_RATIO && parsed <= MAX_RATIO) {
                    editorRatio = parsed;
                }
            }
        } catch (e) { console.error(e); }
        return editorRatio;
    }

    function saveRatio() {
        safeStorage.set(RATIO_STORAGE_KEY, String(editorRatio));
    }

    function getLayoutDirection() {
        return window.matchMedia('(max-width: 768px)').matches ? 'vertical' : 'horizontal';
    }

    function applyRatio() {
        // Skip ratio application when mobile nav is focused on a single panel
        if (workspace.classList.contains('editor-focused') || workspace.classList.contains('preview-focused')) return;
        const direction = getLayoutDirection();
        if (direction === 'horizontal') {
            editorPanel.style.flexBasis = `${editorRatio * 100}%`;
            previewPanel.style.flexBasis = `${(1 - editorRatio) * 100}%`;
            editorPanel.style.height = '';
            previewPanel.style.height = '';
        } else {
            editorPanel.style.height = `${editorRatio * 100}%`;
            previewPanel.style.height = `${(1 - editorRatio) * 100}%`;
            editorPanel.style.flexBasis = 'auto';
            previewPanel.style.flexBasis = 'auto';
        }
        editor.refresh();
    }

    function startDrag(clientX, clientY) {
        isDragging = true;
        resizer.classList.add('dragging');
        dragDirection = getLayoutDirection();
        const mainRect = mainContent.getBoundingClientRect();
        if (dragDirection === 'horizontal') {
            totalSize = mainRect.width - resizer.offsetWidth;
            startCoord = clientX;
        } else {
            totalSize = mainRect.height - resizer.offsetHeight;
            startCoord = clientY;
        }
        startRatio = editorRatio;
        dragOverlay.classList.add('active');
        dragOverlay.style.cursor = dragDirection === 'horizontal' ? 'col-resize' : 'row-resize';
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onDragEnd);
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);
        document.body.style.userSelect = 'none';
    }

    function onMouseMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        updateRatio(dragDirection === 'horizontal' ? e.clientX : e.clientY);
    }

    function onTouchMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.touches[0];
        if (touch) updateRatio(dragDirection === 'horizontal' ? touch.clientX : touch.clientY);
    }

    function updateRatio(coord) {
        const delta = coord - startCoord;
        let newRatio = (startRatio * totalSize + delta) / totalSize;
        newRatio = Math.max(MIN_RATIO, Math.min(MAX_RATIO, newRatio));
        if (Math.abs(newRatio - editorRatio) > 0.001) {
            editorRatio = newRatio;
            applyRatio();
        }
    }

    function onDragEnd() {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove('dragging');
        dragOverlay.classList.remove('active');
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchmove', onTouchMove);
        document.removeEventListener('touchend', onDragEnd);
        document.body.style.userSelect = '';
        saveRatio();
    }

    resizer.setAttribute('role', 'separator');
    resizer.setAttribute('aria-orientation', 'vertical');
    resizer.setAttribute('aria-label', '调整编辑器与预览面板大小');
    resizer.setAttribute('tabindex', '0');
    resizer.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
    resizer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        if (touch) startDrag(touch.clientX, touch.clientY);
    }, { passive: false });
    resizer.addEventListener('keydown', (e) => {
        const cur = loadRatio();
        let next = cur;
        if (e.key === 'ArrowLeft') { e.preventDefault(); next = Math.max(MIN_RATIO, cur - 0.02); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); next = Math.min(MAX_RATIO, cur + 0.02); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next = 0.5; }
        else return;
        editorRatio = next;
        applyRatio();
        saveRatio();
    });

    let resizeRaf = null;
    window.addEventListener('resize', () => {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(() => { applyRatio(); editor.refresh(); });
    });

    // ==================== Color Mode ====================
    const COLOR_MODE_KEY = 'editor_color_mode';
    const btnColorMode = document.getElementById('btnColorMode');
    const iconColorMode = document.getElementById('iconColorMode');

    function loadColorMode() {
        try {
            const stored = safeStorage.get(COLOR_MODE_KEY);
            if (stored && (stored === 'light' || stored === 'dark')) return stored;
        } catch (e) { console.error(e); }
        return 'light';
    }

    function applyColorMode(mode) {
        document.documentElement.setAttribute('data-color-mode', mode);
        document.documentElement.style.colorScheme = mode;
        const use = iconColorMode.querySelector('use');
        if (mode === 'light') {
            use.setAttribute('href', '#icon-moon');
            btnColorMode.setAttribute('aria-label', '切换到深色模式');
        } else {
            use.setAttribute('href', '#icon-sun');
            btnColorMode.setAttribute('aria-label', '切换到浅色模式');
        }
        editor.refresh();
    }

    function toggleColorMode() {
        const current = document.documentElement.getAttribute('data-color-mode') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        btnColorMode.classList.add('switching');
        setTimeout(() => btnColorMode.classList.remove('switching'), 350);
        applyColorMode(next);
        safeStorage.set(COLOR_MODE_KEY, next);
    }

    btnColorMode.addEventListener('click', toggleColorMode);

    // Light is the intentional product default. The interface only follows an
    // explicit user choice, so an operating-system theme change cannot flip it
    // unexpectedly after the page has loaded.

    // ==================== Theme ====================
    const THEME_STORAGE_KEY = 'editor_theme';
    const VALID_THEMES = ['amber', 'slate', 'forest', 'ink', 'plum', 'ochre'];

    // Theme color overrides
    const THEME_COLORS = {
        amber: { accent: '#D4A853', accentHover: '#E0BC6B' },
        slate: { accent: '#7BA4C0', accentHover: '#95B8D2' },
        forest: { accent: '#8DAF82', accentHover: '#A3C098' },
        ink: { accent: '#D0756E', accentHover: '#DF8E88' },
        plum: { accent: '#A89BC4', accentHover: '#BBB0D4' },
        ochre: { accent: '#D4956A', accentHover: '#E0A880' }
    };

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelectorAll('.theme-dot').forEach(dot => {
            dot.setAttribute('aria-checked', dot.getAttribute('data-theme') === theme ? 'true' : 'false');
        });
        // Apply theme accent override
        const colors = THEME_COLORS[theme];
        if (colors) {
            document.documentElement.style.setProperty('--accent', colors.accent);
            document.documentElement.style.setProperty('--accent-hover', colors.accentHover);
        }
        editor.refresh();
    }

    function setTheme(theme) {
        if (!VALID_THEMES.includes(theme)) return;
        applyTheme(theme);
        safeStorage.set(THEME_STORAGE_KEY, theme);
    }

    function loadTheme() {
        try {
            const stored = safeStorage.get(THEME_STORAGE_KEY);
            if (stored && VALID_THEMES.includes(stored)) return stored;
        } catch (e) { console.error(e); }
        return 'amber';
    }

    if (typeof marked !== 'undefined') {
        marked.setOptions({
            gfm: true, breaks: false, headerIds: false, mangle: false
        });
    }

    // Markdown 代码高亮后处理（marked 14.x 移除了内置 highlight 选项）
    function highlightCodeBlocks(html) {
        if (typeof hljs === 'undefined') return html;
        return html.replace(/<pre><code(?:\s+class="(?:language-|hljs )?([\w-]+)")?>([\s\S]*?)<\/code><\/pre>/g, function(match, lang, code) {
            code = code.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
            try {
                if (lang && hljs.getLanguage(lang)) return '<pre><code class="hljs language-' + lang + '">' + hljs.highlight(code, { language: lang }).value + '</code></pre>';
                return '<pre><code class="hljs">' + hljs.highlightAuto(code).value + '</code></pre>';
            } catch (e) { return match; }
        });
    }

    // ==================== 全局错误边界 ====================
    window.addEventListener('error', (e) => {
        // 忽略来自预览 iframe 的错误（用户代码错误不应影响编辑器）
        if (e.target && (e.target.tagName === 'IFRAME' || e.target.nodeName === 'IFRAME')) return;
        console.error('[Werkstatt] 未捕获错误:', e.error?.message || e.message);
    });
    window.addEventListener('unhandledrejection', (e) => {
        console.error('[Werkstatt] 未处理的 Promise 拒绝:', e.reason?.message || e.reason);
    });

    document.addEventListener('DOMContentLoaded', () => {
        const colorMode = loadColorMode();
        applyColorMode(colorMode);
        const currentTheme = loadTheme();
        applyTheme(currentTheme);
        requestAnimationFrame(() => requestAnimationFrame(() => {
            document.documentElement.classList.remove('theme-preload');
        }));
        document.querySelectorAll('.theme-dot').forEach(dot => {
            dot.addEventListener('click', () => setTheme(dot.getAttribute('data-theme')));
        });
        initLeftResizer();
        initAiPanel();
    });

    // ==================== Multi-language ====================
    const LANG_CONFIG = {
        html: { mode: 'htmlmixed', label: 'HTML', ext: '.html' },
        css: { mode: 'css', label: 'CSS', ext: '.css', wrap: true },
        js: { mode: 'javascript', label: 'JS', ext: '.js', wrap: true },
        ts: { mode: 'text/typescript', label: 'TS', ext: '.ts', wrap: true, compile: 'ts' },
        tsx: { mode: 'text/typescript-jsx', label: 'TSX', ext: '.tsx', wrap: true, compile: 'ts' },
        scss: { mode: 'text/x-scss', label: 'SCSS', ext: '.scss', wrap: true, compile: 'scss' },
        md: { mode: 'gfm', label: 'MD', ext: '.md', compile: 'md' },
        json: { mode: 'application/json', label: 'JSON', ext: '.json' },
    };
    const LANG_STORAGE = 'editor_current_lang';
    const DOCUMENT_TYPE_MODE_STORAGE = 'editor_document_type_mode';
    const CODE_PREFIX = 'editor_code_';
    const FILE_NAME_PREFIX = 'editor_file_name_';
    let currentLang = 'html';
    let currentFileName = 'index.html';
    let documentTypeMode = 'auto';
    let babelReady = false;
    let sassReady = false;

    function detectLang(ext) {
        const map = { ts: 'ts', tsx: 'tsx', scss: 'scss', md: 'md', markdown: 'md', json: 'json', html: 'html', htm: 'html', css: 'css', js: 'js' };
        return map[ext] || 'html';
    }

    function getDocumentTypeLabel(lang) {
        const labels = { html: 'HTML', md: 'Markdown', css: 'CSS', js: 'JavaScript', ts: 'TypeScript', tsx: 'TSX', scss: 'SCSS', json: 'JSON' };
        return labels[lang] || (LANG_CONFIG[lang]?.label || 'HTML');
    }

    function htmlConfidence(code) {
        const text = String(code || '').replace(/^\uFEFF/, '').trim();
        if (!text) return 0;
        let score = 0;
        if (/^<!doctype\s+html\b/i.test(text)) score += 8;
        if (/<html(?:\s[^>]*)?>[\s\S]*<\/html\s*>/i.test(text)) score += 7;
        if (/<head(?:\s[^>]*)?>[\s\S]*<\/head\s*>/i.test(text)) score += 4;
        if (/<body(?:\s[^>]*)?>[\s\S]*<\/body\s*>/i.test(text)) score += 4;
        if (/<(?:main|section|article|header|footer|nav|form|table|div)(?:\s[^>]*)?>[\s\S]*<\/(?:main|section|article|header|footer|nav|form|table|div)\s*>/i.test(text)) score += 3;
        if (/<(?:style|script)(?:\s[^>]*)?>[\s\S]*<\/(?:style|script)\s*>/i.test(text)) score += 2;
        if (/^<!--[\s\S]*?-->/i.test(text)) score += 2;
        if (/^<[a-z][\w:-]*(?:\s[^>]*)?>[\s\S]*<\/[a-z][\w:-]*\s*>$/i.test(text)) score += 2;
        return score;
    }

    function looksLikeHtml(code) { return htmlConfidence(code) >= 3; }

    function markdownConfidence(code) {
        const text = String(code || '').replace(/^\uFEFF/, '');
        if (!text.trim()) return 0;
        let score = 0;
        const headings = text.match(/^#{1,6}\s+\S.*$/gm) || [];
        const quotes = text.match(/^>\s+\S.*$/gm) || [];
        const lists = text.match(/^\s*(?:[-+*]|\d+[.)])\s+\S.*$/gm) || [];
        if (headings.length) score += Math.min(4, headings.length + 1);
        if (quotes.length) score += Math.min(3, quotes.length + 1);
        if (lists.length >= 2) score += 2;
        else if (lists.length === 1) score += 1;
        if (/```[\s\S]*?```/.test(text) || /^~~~\w*\s*$/m.test(text)) score += 3;
        if (/\*\*[^*\n]+\*\*/.test(text) || /__[^_\n]+__/.test(text)) score += 1;
        if (/(^|\s)[*_][^*_\n]+[*_](?=\s|$|[，。！？,.!?])/m.test(text)) score += 1;
        if (/\[[^\]\n]+\]\([^\s)]+(?:\s+"[^"]*")?\)/.test(text)) score += 1;
        if (/^\s*(?:---+|___+|\*\*\*+)\s*$/m.test(text)) score += 1;
        if (/^\|.+\|\s*$[\r\n]+^\|\s*:?-{3,}/m.test(text)) score += 2;
        const htmlScore = htmlConfidence(text);
        if (htmlScore >= 7) score = Math.max(0, score - 5);
        return score;
    }

    function looksLikeMarkdown(code) {
        const mdScore = markdownConfidence(code);
        const htmlScore = htmlConfidence(code);
        return mdScore >= 2 && mdScore >= htmlScore;
    }

    function detectDocumentLanguage(code, options = {}) {
        const text = String(code || '').replace(/^\uFEFF/, '');
        const trimmed = text.trim();
        if (!trimmed) return { lang: currentLang || 'html', confidence: 0, reason: 'empty' };

        if (options.fileName) {
            const match = String(options.fileName).toLowerCase().match(/\.([a-z0-9]+)$/);
            const ext = match ? match[1] : '';
            if (ext && Object.prototype.hasOwnProperty.call({ html:1, htm:1, md:1, markdown:1, css:1, js:1, ts:1, tsx:1, scss:1, json:1 }, ext)) {
                const lang = ext === 'markdown' ? 'md' : detectLang(ext);
                return { lang, confidence: 100, reason: 'extension' };
            }
        }

        const htmlScore = htmlConfidence(text);
        const mdScore = markdownConfidence(text);
        if (htmlScore >= 5 && htmlScore >= mdScore + 2) {
            return { lang: 'html', confidence: htmlScore, reason: 'html-structure' };
        }
        if (mdScore >= 2 && (mdScore >= htmlScore || htmlScore <= 3)) {
            return { lang: 'md', confidence: mdScore, reason: 'markdown-syntax' };
        }
        if (htmlScore >= 3 && mdScore === 0) {
            return { lang: 'html', confidence: htmlScore, reason: 'html-fragment' };
        }

        if (/^[\[{]/.test(trimmed)) {
            try {
                JSON.parse(trimmed);
                return { lang: 'json', confidence: 6, reason: 'json-parse' };
            } catch (e) { /* keep current type */ }
        }
        return { lang: currentLang || 'html', confidence: 0, reason: 'ambiguous' };
    }

    function loadDocumentTypeMode() {
        const saved = safeStorage.get(DOCUMENT_TYPE_MODE_STORAGE, 'auto');
        return saved === 'manual' ? 'manual' : 'auto';
    }

    function setDocumentTypeMode(mode, options = {}) {
        documentTypeMode = mode === 'manual' ? 'manual' : 'auto';
        if (options.persist !== false) safeStorage.set(DOCUMENT_TYPE_MODE_STORAGE, documentTypeMode);
        updateLanguageUi();
    }

    function splitCurrentFileName() {
        const cfg = LANG_CONFIG[currentLang] || LANG_CONFIG.html;
        const name = String(currentFileName || ('untitled' + cfg.ext));
        const expectedExt = cfg.ext || '';
        if (expectedExt && name.toLowerCase().endsWith(expectedExt.toLowerCase())) {
            return { base: name.slice(0, -expectedExt.length) || 'untitled', ext: expectedExt };
        }
        const match = name.match(/^(.*?)(\.[^.]+)?$/);
        return { base: (match && match[1]) || 'untitled', ext: (match && match[2]) || expectedExt };
    }

    function formatByteSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10240 ? 1 : 0) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function updateDocumentMetrics() {
        if (!documentMetrics) return;
        const code = getCode();
        const lines = code ? code.split(/\r\n?|\n/).length : 1;
        let bytes;
        try { bytes = new TextEncoder().encode(code).length; }
        catch (e) { bytes = unescape(encodeURIComponent(code)).length; }
        documentMetrics.textContent = lines + ' 行 · ' + formatByteSize(bytes);
        documentMetrics.title = lines + ' 行，UTF-8 大小 ' + formatByteSize(bytes);
    }

    function setDocumentSaveState(state) {
        if (!documentSaveIndicator) return;
        const saving = state === 'saving';
        documentSaveIndicator.classList.toggle('saving', saving);
        documentSaveIndicator.setAttribute('aria-label', saving ? '正在自动保存' : '已自动保存');
        documentSaveIndicator.title = saving ? '正在自动保存到本机' : '已自动保存到本机';
    }

    function updateLanguageUi(options = {}) {
        const cfg = LANG_CONFIG[currentLang] || LANG_CONFIG.html;
        const displayLabel = getDocumentTypeLabel(currentLang);
        const isAuto = documentTypeMode === 'auto';
        if (languageSelect) {
            const autoOption = languageSelect.querySelector('option[value="auto"]');
            if (autoOption) autoOption.textContent = '自动 · ' + displayLabel;
            languageSelect.value = isAuto ? 'auto' : currentLang;
            languageSelect.title = isAuto
                ? '当前自动识别为 ' + displayLabel + '；选择具体类型可手动锁定'
                : '当前已手动锁定为 ' + displayLabel + '；选择“自动”恢复自动识别';
            languageSelect.setAttribute('aria-label', isAuto ? '文档类型：自动识别为 ' + displayLabel : '文档类型：手动锁定为 ' + displayLabel);
        }
        const fileParts = splitCurrentFileName();
        if (currentFileLabel) currentFileLabel.textContent = fileParts.base;
        if (currentFileExtension) currentFileExtension.textContent = fileParts.ext;
        if (currentFileButton) currentFileButton.title = currentFileName + ' · 单击重命名；扩展名由文档类型决定';
        updateDocumentMetrics();
        if (formatDetectionBadge) {
            const showDetection = options.showDetection === true && isAuto;
            formatDetectionBadge.hidden = !showDetection;
            formatDetectionBadge.textContent = showDetection ? '自动识别为 ' + displayLabel : '';

    function getStorageKey(lang) { return CODE_PREFIX + lang; }

    function switchLanguage(lang, fileName, options = {}) {
        if (!LANG_CONFIG[lang]) lang = 'html';
        const previousLang = currentLang;
        if (options.saveCurrent !== false && previousLang && previousLang !== lang) saveEditorCode();
        currentLang = lang;
        currentFileName = fileName || safeStorage.get(FILE_NAME_PREFIX + lang) || ('index' + LANG_CONFIG[lang].ext);
        safeStorage.set(FILE_NAME_PREFIX + lang, currentFileName);
        const cfg = LANG_CONFIG[lang];
        editor.setOption('mode', cfg.mode);
        safeStorage.set(LANG_STORAGE, lang);
        rebuildLangTabs();
        updateLanguageUi({ showDetection: options.showDetection === true });
        if (options.deferPreview !== true) updatePreview();

    function autoDetectDocumentLanguage(options = {}) {
        if (documentTypeMode !== 'auto' && options.force !== true) return false;
        const code = getCode();
        const detection = detectDocumentLanguage(code, { fileName: options.fileName || '' });
        const nextLang = detection.lang;
        if (!LANG_CONFIG[nextLang]) return false;
        if (nextLang === currentLang) {
            updateLanguageUi({ showDetection: options.showDetection === true });
            return false;
        }

        const previousLang = currentLang;
        const previousKey = getStorageKey(previousLang);
        const previousStoredCode = safeStorage.get(previousKey);
        const baseName = (currentFileName || 'untitled').replace(/\.[^.]+$/, '') || 'untitled';
        switchLanguage(nextLang, baseName + LANG_CONFIG[nextLang].ext, {
            saveCurrent: false,
            deferPreview: true,
            showDetection: true
        });
        if (previousStoredCode === code) safeStorage.remove(previousKey);
        if (options.silent !== true) {
            showToast('已自动识别为 ' + getDocumentTypeLabel(nextLang) + '；可在类型菜单中手动锁定', 'success');

    }

    function rebuildLangTabs() {
        const container = document.querySelector('.lang-tabs');
        if (!container) return;
        container.innerHTML = '';
        const langs = ['html', 'css', 'js', 'ts', 'tsx', 'scss', 'md', 'json'];
        let hasAny = false;
        langs.forEach(lang => {
            const key = CODE_PREFIX + lang;
            let code = '';
            code = safeStorage.get(key);
            if (!code.trim()) return;
            hasAny = true;
            const cfg = LANG_CONFIG[lang];
            const isExperimental = (lang === 'ts' || lang === 'tsx' || lang === 'scss');
            const tab = document.createElement('span');
            tab.className = 'lang-tab';
            tab.innerHTML = '<span class="dot"></span>' + cfg.label + (isExperimental ? '<span class="exp-tag">实验</span>' : '');
            tab.querySelector('.dot').style.background = LANG_COLORS[lang] || 'var(--accent)';
            container.appendChild(tab);
        });
        if (!hasAny) {
            const empty = document.createElement('span');
            empty.className = 'lang-tab';
            empty.style.color = 'var(--text-tertiary)';

            container.appendChild(empty);

    function wrapDefaultHtml(code, lang) {

    }

    async function compileTs(code, lang) {
        await ensureBabel();
        try {
            const result = Babel.transform(code, { presets: ['typescript'], filename: 'file.' + lang, sourceMaps: false });
            return wrapDefaultHtml(result.code, 'js');
        } catch (e) { return errorHtml('TypeScript 编译错误: ' + e.message, code); }

    async function compileScss(code) {
        await ensureSass();
        return new Promise((resolve) => {
            Sass.compile(code, function(result) {
                if (result.status === 0) { resolve(wrapDefaultHtml(result.text, 'css')); }

    function errorHtml(message, code) {

    async function compileCode(lang) {

        const cfg = LANG_CONFIG[lang];
        if (!cfg) return code;
        if (!cfg.compile && !cfg.wrap) return code;
        if (lang === 'md') return compileMd(code);
        if (cfg.compile === 'ts') return await compileTs(code, lang);
        if (cfg.compile === 'scss') return await compileScss(code);
        return wrapDefaultHtml(code, lang);

            s.src = 'https://unpkg.com/@babel/standalone@7.24.0/babel.min.js';

                resolve(previewInspection);

            const done = (payload) => { clearTimeout(timer); resolve(payload); };
            previewInspectionResolvers.push(done);
            previewFrame.contentWindow.postMessage({ type: 'werkstatt-preview-inspect' }, '*');

            get(k, fb = '') { if (!check()) return _mem[k] ?? fb; try { const v = localStorage.getItem(k); return v !== null ? v : fb; } catch (e) { return _mem[k] ?? fb; } },
            set(k, v) { _mem[k] = v; if (!check()) return false; try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
            remove(k) { delete _mem[k]; if (!check()) return false; try { localStorage.removeItem(k); return true; } catch (e) { return false; } },
            json(k, fb = null) { try { const r = this.get(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } },

    function injectPreviewCsp(html) {
        // file:// 下 CSP 与 srcdoc iframe 不兼容，跳过注入
        if (_isFileProtocol) return html;
        // 预览 iframe CSP：允许外部 CDN 资源加载（用户代码常用），仅阻止 object/embed
        const csp = '<meta http-equiv="Content-Security-Policy" content="default-src * data: blob:; script-src * \'unsafe-inline\' \'unsafe-eval\' data: blob:; style-src * \'unsafe-inline\' data: blob:; img-src * data: blob:; font-src * data: blob:; connect-src *; object-src \'none\'; base-uri *; form-action *;">';
        if (/<head\b/i.test(html)) {
            return html.replace(/(<head(\s[^>]*)?>)/i, '$1\n' + csp);
        } else if (/<html\b/i.test(html)) {
            return html.replace(/(<html(\s[^>]*)?>)/i, '$1\n<head>\n' + csp + '\n</head>');
        } else {
            return '<!DOCTYPE html>\n<html>\n<head>\n' + csp + '\n</head>\n<body>\n' + html + '\n</body>\n</html>';
        }
    }

            if (code.trim().length > 0) { previewPlaceholder.classList.add('hidden'); }
            else { previewPlaceholder.classList.remove('hidden'); }
        } catch (err) {
            console.warn('预览更新失败:', err.message);

            previewPlaceholder.classList.remove('hidden');
            const hint = previewPlaceholder.querySelector('span');

            showStatus('预览失败', 'error');
        }
    }

    (function patchUpdatePreview() {
        const _orig = updatePreview;
        let previewToken = 0; // 编译版本号，防止异步竞态
        updatePreview = async function() {
            const code = getCode();
            if (documentTypeMode === 'auto') autoDetectDocumentLanguage({ silent: true });
            const previewLang = currentLang;
            updateLanguageUi();
            // HTML remains raw preview; every other recognized type goes through its compiler.
            if (previewLang === 'html' || !LANG_CONFIG[previewLang] || (previewLang !== 'md' && looksLikeHtml(code))) { _orig(); return; }
            const myToken = ++previewToken;
            try {
                const compiled = await compileCode(previewLang);
                // 如果在编译期间又触发了新的预览请求，丢弃这次过期的结果
                if (myToken !== previewToken) return;
                updatePreviewWith(compiled);
                previewFrame.style.display = 'block';
                const code = getCode();
                if (code.trim().length > 0) { previewPlaceholder.classList.add('hidden'); }
                else { previewPlaceholder.classList.remove('hidden'); }
            } catch (err) {
                if (myToken !== previewToken) return;
                updatePreviewWith(errorHtml('编译错误: ' + (err.message || err)));
                showStatus('编译失败', 'error');
            }
        };
    })();

    async function copyCode() {

        resizerLeft.addEventListener('keydown', (e) => {

                return memory.has(k) ? memory.get(k) : fb;
            },
            set(k, v) {
                memory.set(k, String(v));
                try { sessionStorage.setItem(k, String(v)); return true; } catch (_) { return false; }

        const host = url.hostname.toLowerCase();

            const langTab = document.querySelector('.lang-tab[data-lang="' + snapshot.lang + '"]');

        if (snapshot.scrollPos) {

        showToast('已撤销: ' + snapshot.summary, '');

    const MANAGED_ASSET_HOSTS = new Set(['cdnjs.cloudflare.com', 'cdn.jsdelivr.net']);

    function normalizeManagedLibraryName(name) {
        const key = String(name || '').toLowerCase().replace(/[\s._-]+/g, '');
        const aliases = { chart: 'chartjs', chartjs: 'chartjs', d3js: 'd3', three: 'threejs', threejs: 'threejs', anime: 'animejs', animejs: 'animejs', scrolltrigger: 'scrolltrigger', gsapscrolltrigger: 'scrolltrigger' };
        return aliases[key] || key;
    }
    function expandManagedLibraries(libraries) {
        const ordered = [], seen = new Set();
        const visit = (raw) => {
            const key = normalizeManagedLibraryName(raw);
            const entry = MANAGED_LIBRARY_CATALOG[key];
            if (!entry || seen.has(key)) return;
            entry.dependencies.forEach(visit);
            seen.add(key); ordered.push(key);
        };
        (Array.isArray(libraries) ? libraries : [libraries]).forEach(visit);
        return ordered;
    }
    function isTrustedManagedAssetUrl(rawUrl) {
        try {
            const url = new URL(String(rawUrl || ''));
            return url.protocol === 'https:' && MANAGED_ASSET_HOSTS.has(url.hostname);
        } catch (_) { return false; }
    }
    function extractExecutableAssetUrls(code) {
        const urls = [];
        const text = String(code || '');
        const add = (type, url) => { if (url && /^(?:https?:)?\/\//i.test(url)) urls.push({ type, url }); };
        text.replace(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>/gi, (_, url) => { add('script', url); return _; });
        text.replace(/<link\b[^>]*\brel\s*=\s*["'][^"']*stylesheet[^"']*["'][^>]*\bhref\s*=\s*["']([^"']+)["'][^>]*>/gi, (_, url) => { add('style', url); return _; });
        text.replace(/<link\b[^>]*\bhref\s*=\s*["']([^"']+)["'][^>]*\brel\s*=\s*["'][^"']*stylesheet[^"']*["'][^>]*>/gi, (_, url) => { add('style', url); return _; });
        text.replace(/@import\s+(?:url\()?\s*["']?((?:https?:)?\/\/[^\s"')]+)["']?\s*\)?/gi, (_, url) => { add('style', url); return _; });
        text.replace(/(?:\.src\s*=|setAttribute\(\s*["']src["']\s*,)\s*["']((?:https?:)?\/\/[^"']+)["']/gi, (_, url) => { add('script', url); return _; });
        text.replace(/(?:import\s*(?:[^'"()]*?\sfrom\s*)?\(|import\s+[^'";]+?\sfrom\s+|new\s+(?:Worker|SharedWorker)\s*\()\s*["']((?:https?:)?\/\/[^"']+)["']/gi, (_, url) => { add('script', url); return _; });
        return urls;
    }
    function validateAiManagedAssetPolicy(beforeCode, afterCode) {
        const before = new Set(extractExecutableAssetUrls(beforeCode).map(x => x.url));
        const added = extractExecutableAssetUrls(afterCode).filter(x => !before.has(x.url));
        if (!added.length) return { safe: true };
        return {
            safe: false,
            reason: 'AI 不允许直接写入外部脚本或样式地址。请改为请求系统启用对应库；版本、可信地址、HTTPS、去重和加载顺序由底层自动处理。',
            assets: added.map(x => x.url)
        };
    }
    function stripManagedLibraryTags(code, libraryKey) {
        const entry = MANAGED_LIBRARY_CATALOG[libraryKey];
        if (!entry) return code;
        const matchesLibrary = (url) => entry.files.some(file => file.signatures.some(re => re.test(url)));
        let next = String(code || '');
        next = next.replace(/\s*<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>\s*<\/script\s*>\s*/gi, (tag, url) => matchesLibrary(url) ? '\n' : tag);
        next = next.replace(/\s*<link\b[^>]*\bhref\s*=\s*["']([^"']+)["'][^>]*>\s*/gi, (tag, url) => matchesLibrary(url) ? '\n' : tag);
        return next;
    }
    function insertManagedTags(code, tags) {
        if (!tags.length) return code;
        const block = tags.map(tag => '  ' + tag).join('\n') + '\n';
        if (/<\/head>/i.test(code)) return code.replace(/<\/head>/i, block + '</head>');
        if (/<head[^>]*>/i.test(code)) return code.replace(/<head[^>]*>/i, m => m + '\n' + block);
        if (/<html[^>]*>/i.test(code)) return code.replace(/<html[^>]*>/i, m => m + '\n<head>\n' + block + '</head>');
        if (/<!doctype[^>]*>/i.test(code)) return code.replace(/<!doctype[^>]*>/i, m => m + '\n<head>\n' + block + '</head>');
        return '<head>\n' + block + '</head>\n' + code;
    }
    function applyManagedLibrariesToCode(code, requestedLibraries) {
        const libraries = expandManagedLibraries(requestedLibraries);
        if (!libraries.length) return { code, changed: false, enabled: [], unknown: requestedLibraries };
        let next = String(code || '');
        const tags = [], enabled = [];
        for (const key of libraries) {
            const entry = MANAGED_LIBRARY_CATALOG[key];
            next = stripManagedLibraryTags(next, key);
            for (const file of entry.files) {
                if (!isTrustedManagedAssetUrl(file.url)) throw new Error('系统依赖地址未通过 HTTPS/可信来源校验');
                const tag = file.type === 'style'
                    ? '<link rel="stylesheet" href="' + file.url + '" data-werkstatt-library="' + key + '">'
                    : '<script src="' + file.url + '" data-werkstatt-library="' + key + '"><\/script>';
                tags.push(tag);
            }
            enabled.push(entry.label);
        }
        next = insertManagedTags(next, tags);
        return { code: next, changed: next !== code, enabled };
    }
    function detectRequiredManagedLibraries(code) {
        const text = String(code || '');
        const required = [];
        if (/\bScrollTrigger\b|scrollTrigger\s*:/i.test(text)) required.push('scrolltrigger');
        else if (/\bgsap\s*\./.test(text)) required.push('gsap');
        if (/\bnew\s+Chart\s*\(|\bChart\s*\./.test(text)) required.push('chartjs');
        if (/\bd3\s*\./.test(text)) required.push('d3');
        if (/\b_\.(?:map|filter|reduce|debounce|throttle|cloneDeep|merge)\s*\(/.test(text)) required.push('lodash');
        if (/\bdayjs\s*\(/.test(text)) required.push('dayjs');
        if (/\baxios\s*\./.test(text)) required.push('axios');
        if (/\bTHREE\s*\./.test(text)) required.push('threejs');
        if (/\banime\s*\(/.test(text)) required.push('animejs');
        return [...new Set(required)];
    }
    function hasManagedLibrary(code, libraryKey) {
        const entry = MANAGED_LIBRARY_CATALOG[libraryKey];
        if (!entry) return false;
        const urls = extractExecutableAssetUrls(code).map(x => x.url);
        return entry.files.every(file => urls.some(url => file.signatures.some(re => re.test(url))));
    }
    function auditManagedDependencies(code) {
        const required = expandManagedLibraries(detectRequiredManagedLibraries(code));
        const missing = required.filter(key => !hasManagedLibrary(code, key));
        return { required, missing };
    }
    function autoEnableManagedLibrariesAfterAiEdit() {
        const current = getCode();
        const required = detectRequiredManagedLibraries(current);
        if (!required.length) return { changed: false, enabled: [] };
        const result = applyManagedLibrariesToCode(current, required);
        if (result.changed) setCode(result.code);
        return result;
    }
    function enableManagedLibrary(library) {
        const key = normalizeManagedLibraryName(library);
        if (!MANAGED_LIBRARY_CATALOG[key]) return { success: false, message: '不支持的系统托管库: ' + library };
        const result = applyManagedLibrariesToCode(getCode(), [key]);
        if (result.changed) { setCode(result.code); updatePreview(); }
        return { success: true, message: result.changed ? '已启用 ' + result.enabled.join('、') + '；版本、HTTPS、去重与加载顺序已自动处理' : result.enabled.join('、') + ' 已处于可用状态' };
    }

    function parseManagedDependencyDirectives(text) {
        const requested = [], unknown = [];
        const cleaned = String(text || '').replace(/^\s*(?:DEPENDENCY|DEPENDENCIES|依赖|启用依赖)\s*[:：]\s*([^\r\n]+)\s*$/gmi, (_, raw) => {
            String(raw).split(/[,，、+\s]+/).filter(Boolean).forEach(name => {
                const key = normalizeManagedLibraryName(name);
                if (MANAGED_LIBRARY_CATALOG[key]) requested.push(key);
                else unknown.push(name);
            });
            return '';
        }).replace(/^\s{0,3}[-*]\s*(?:DEPENDENCY|依赖)\s*[:：]\s*([^\r\n]+)\s*$/gmi, (_, raw) => {
            String(raw).split(/[,，、+\s]+/).filter(Boolean).forEach(name => {
                const key = normalizeManagedLibraryName(name);
                if (MANAGED_LIBRARY_CATALOG[key]) requested.push(key);
                else unknown.push(name);
            });
            return '';
        }).replace(/^\s*\n/, '').trim();
        return { requested: [...new Set(requested)], unknown: [...new Set(unknown)], cleaned };
    }

    function applyManagedDependenciesForAi(requested, beforeCode) {
        const inferred = detectRequiredManagedLibraries(getCode());
        const libraries = [...new Set([...(requested || []), ...inferred])];
        if (!libraries.length) return { success: true, changed: false, enabled: [] };
        try {
            const result = applyManagedLibrariesToCode(getCode(), libraries);
            if (result.changed) setCode(result.code);
            const audit = auditManagedDependencies(getCode());
            if (audit.missing.length) {
                setCode(beforeCode);
                return { success: false, message: '系统托管依赖未完整启用：' + audit.missing.join('、') };
            }
            return { success: true, ...result };
        } catch (error) {
            setCode(beforeCode);
            return { success: false, message: error.message || '依赖启用失败' };
        }
    }

    function generateCodeHints(code, lang) {

                        hints.push(`.${c} 类`);

                if (match && hints.length < maxHints) {
                    hints.push(`${match[1].trim()}（第 ${idx + 1} 行）`);
                }

                if (fnMatch && hints.length < maxHints) {

                    if (name && !seen.has(name)) {

                        hints.push(`函数 ${name}()（第 ${idx + 1} 行）`);
                    }

        const thinkingMatch = aiText.match(/<thinking>([\s\S]*?)<\/thinking>/);
        const thinking = thinkingMatch ? thinkingMatch[1].trim() : null;
        let answer = aiText.replace(/<thinking>[\s\S]*?<\/thinking>/g, '').trim();
        // Also remove any markdown code fence indicators from the answer for display
        return { thinking, answer };
    }

    // 若文本为合法 JSON 则返回格式化后的字符串，否则返回 null
    function formatJsonIfApplicable(text) {
        const trimmed = text.trim();
        if (!(trimmed.startsWith('{') || trimmed.startsWith('['))) return null;
        try { return JSON.stringify(JSON.parse(trimmed), null, 2); }
        catch (e) { return null; }
    }

    // ==================== Incremental Edit Engine ====================
    function parseSearchReplaceBlocks(text) {
        const blocks = [];
        const pattern = /```replace\s*\n?([\s\S]*?)\n?```/g;
        let m;
        while ((m = pattern.exec(text)) !== null) {
            const inner = m[1];
            // Use index-based parsing instead of regex to avoid false matches when SEARCH content contains ">>>"
            const searchIdx = inner.indexOf('<<< SEARCH');
            const replaceIdx = inner.indexOf('>>> REPLACE');
            if (searchIdx !== -1 && replaceIdx !== -1 && replaceIdx > searchIdx) {
                let searchText = inner.substring(searchIdx + '<<< SEARCH'.length, replaceIdx);
                let replaceText = inner.substring(replaceIdx + '>>> REPLACE'.length);
                // Trim exactly one leading/trailing newline if present, but preserve intentional blank lines
                searchText = searchText.replace(/^\n/, '').replace(/\n$/, '');
                replaceText = replaceText.replace(/^\n/, '').replace(/\n$/, '');
                blocks.push({ search: searchText, replace: replaceText });
            }
        }
        return blocks;
    }

    function applySearchReplaceBlocks(blocks) {
        const currentCode = getCode();
        if (blocks.length === 0) return { success: false, reason: 'no_blocks' };

        // Try exact match, then trimmed match, then leading-whitespace-flexible match
        function findUniqueMatch(text, code) {
            // 1. Exact match
            let idx = code.indexOf(text);
            if (idx !== -1) {
                const idx2 = code.indexOf(text, idx + text.length);
                if (idx2 === -1) return { idx, len: text.length };
                return null; // ambiguous exact match
            }
            // 2. Overall trimmed match
            const t = text.trim();
            if (t !== text) {
                idx = code.indexOf(t);
                if (idx !== -1) {
                    const idx2 = code.indexOf(t, idx + t.length);
                    if (idx2 === -1) return { idx, len: t.length };
                    return null;
                }
            }
            // 3. Leading-whitespace-flexible match (ignore indentation differences per line)
            const textLines = text.split('\n');
            const codeLines = code.split('\n');
            const strippedText = textLines.map(l => l.replace(/^\s+/, '')).join('\n');
            for (let i = 0; i <= codeLines.length - textLines.length; i++) {
                const candidate = codeLines.slice(i, i + textLines.length);
                const strippedCandidate = candidate.map(l => l.replace(/^\s+/, '')).join('\n');
                if (strippedCandidate === strippedText) {
                    // Verify uniqueness
                    let count = 0;
                    for (let j = 0; j <= codeLines.length - textLines.length; j++) {
                        const c2 = codeLines.slice(j, j + textLines.length).map(l => l.replace(/^\s+/, '')).join('\n');
                        if (c2 === strippedText) count++;
                    }
                    if (count === 1) {
                        const startIdx = codeLines.slice(0, i).join('\n').length + (i > 0 ? 1 : 0);
                        const actualLen = candidate.join('\n').length;
                        return { idx: startIdx, len: actualLen };
                    }
                    return null; // ambiguous flexible match
                }
            }
            return null;
        }

        const matches = [];
        for (const block of blocks) {
            if (!block.search) continue;
            const found = findUniqueMatch(block.search, currentCode);
            if (!found) {
                return { success: false, reason: 'search_not_found', search: block.search.slice(0, 100) };
            }
            matches.push({
                idx: found.idx,
                searchLen: found.len,
                replace: block.replace,
                from: editor.posFromIndex(found.idx),
                to: editor.posFromIndex(found.idx + found.len)
            });
        }

        // Sort by position descending so later replacements don't affect earlier ones
        matches.sort((a, b) => b.idx - a.idx);
        let simulatedCode = currentCode;
        for (const m of matches) simulatedCode = simulatedCode.slice(0, m.idx) + m.replace + simulatedCode.slice(m.idx + m.searchLen);
        const assetPolicy = validateAiManagedAssetPolicy(currentCode, simulatedCode);
        if (!assetPolicy.safe) return { success: false, reason: 'managed_asset_policy', message: assetPolicy.reason };

        const changedLines = new Set();
        editor.operation(() => {
            for (const m of matches) {
                editor.replaceRange(m.replace, m.from, m.to);
                const startLine = m.from.line;
                const endPos = editor.posFromIndex(editor.indexFromPos(m.from) + m.replace.length);
                const endLine = endPos.line;
                for (let l = startLine; l <= endLine; l++) changedLines.add(l);
            }
        });

        return { success: true, changedLines: Array.from(changedLines).sort((a, b) => a - b) };
    }

    // ==================== Line-based Edit Engine ====================
    function parseEditBlocks(text) {
        const blocks = [];
        // Support both ```edit and <edit> markup
        const pattern = /(?:```edit|<edit>)\s*\n?([\s\S]*?)\n?(?:```|<\/edit>)/g;
        let m;
        while ((m = pattern.exec(text)) !== null) {
            const inner = m[1];
            const ops = inner.split(/\n(?=REPLACE|INSERT|DELETE)/);
            for (const op of ops) {
                const trimmed = op.trim();
                if (!trimmed) continue;
                const replaceMatch = trimmed.match(/^REPLACE\s+(\d+)(?:-(\d+))?\s*:\s*\n?([\s\S]*?)(?:\s*END\s*)?$/);
                if (replaceMatch) {
                    const startLine = parseInt(replaceMatch[1], 10);
                    const endLine = replaceMatch[2] ? parseInt(replaceMatch[2], 10) : startLine;
                    blocks.push({ type: 'replace', startLine, endLine, content: replaceMatch[3].trim() });
                    continue;
                }
                const insertMatch = trimmed.match(/^INSERT\s+after\s+(\d+)\s*:\s*\n?([\s\S]*?)(?:\s*END\s*)?$/);
                if (insertMatch) {
                    const afterLine = parseInt(insertMatch[1], 10);
                    blocks.push({ type: 'insert', afterLine, content: insertMatch[2].trim() });
                    continue;
                }
                const deleteMatch = trimmed.match(/^DELETE\s+(\d+)(?:-(\d+))?/);
                if (deleteMatch) {
                    const startLine = parseInt(deleteMatch[1], 10);
                    const endLine = deleteMatch[2] ? parseInt(deleteMatch[2], 10) : startLine;
                    blocks.push({ type: 'delete', startLine, endLine });
                }
            }
        }
        return blocks;
    }

    function applyEditBlocks(blocks) {
        if (!Array.isArray(blocks) || blocks.length === 0) return { success: false, reason: 'no_blocks' };
        const originalCode = getCode();
        const originalLines = originalCode.split('\n');
        const maxLine = originalLines.length;
        for (const block of blocks) {
            if (!['replace','insert','delete'].includes(block.type)) return { success: false, reason: 'invalid_operation' };
            if (block.type === 'insert') {
                if (!Number.isInteger(block.afterLine) || block.afterLine < 0 || block.afterLine > maxLine) return { success: false, reason: '行号越界: ' + block.afterLine + '（插入范围 0-' + maxLine + '）' };
            } else {
                if (!Number.isInteger(block.startLine) || !Number.isInteger(block.endLine) || block.startLine < 1 || block.endLine < block.startLine || block.endLine > maxLine) {
                    return { success: false, reason: '行号范围无效: ' + block.startLine + '-' + block.endLine + '（有效范围 1-' + maxLine + '）' };
                }
            }
        }
        // 所有行号都以调用前的同一版本为基准；从后向前模拟，避免前面的编辑改变后续行号。
        const sorted = [...blocks].sort((a, b) => {
            const lineA = a.type === 'insert' ? a.afterLine + 0.5 : a.startLine;
            const lineB = b.type === 'insert' ? b.afterLine + 0.5 : b.startLine;
            return lineB - lineA;
        });
        const simulatedLines = [...originalLines];
        const changedLines = new Set();
        for (const block of sorted) {
            if (block.type === 'replace') {
                const replacement = String(block.content || '').split('\n');
                simulatedLines.splice(block.startLine - 1, block.endLine - block.startLine + 1, ...replacement);
                for (let i = block.startLine - 1; i < block.startLine - 1 + Math.max(1, replacement.length); i++) changedLines.add(i);
            } else if (block.type === 'insert') {
                const insertion = String(block.content || '').split('\n');
                simulatedLines.splice(block.afterLine, 0, ...insertion);
                for (let i = block.afterLine; i < block.afterLine + insertion.length; i++) changedLines.add(i);
            } else {
                simulatedLines.splice(block.startLine - 1, block.endLine - block.startLine + 1);
                changedLines.add(Math.max(0, Math.min(simulatedLines.length - 1, block.startLine - 1)));
            }
        }
        const finalCode = simulatedLines.join('\n');
        const assetPolicy = validateAiManagedAssetPolicy(originalCode, finalCode);
        if (!assetPolicy.safe) return { success: false, reason: 'managed_asset_policy', message: assetPolicy.reason };
        const lastLine = editor.lineCount() - 1;
        const endPos = { line: Math.max(0, lastLine), ch: editor.getLine(Math.max(0, lastLine))?.length || 0 };
        editor.operation(() => editor.replaceRange(finalCode, { line: 0, ch: 0 }, endPos, '+werkstatt-agent'));
        return { success: true, changedLines: Array.from(changedLines).filter(i => i >= 0).sort((a, b) => a - b) };
    }

    function highlightChangedLines(lines) {
        if (!lines || lines.length === 0) return;
        if (highlightTimer) { clearTimeout(highlightTimer); highlightTimer = null; }
        highlightedLines.forEach(line => editor.removeLineClass(line, 'background', 'cm-line-modified'));
        highlightedLines = [];
        lines.forEach(line => {
            editor.addLineClass(line, 'background', 'cm-line-modified');
            highlightedLines.push(line);
        });
        highlightTimer = setTimeout(() => {
            highlightedLines.forEach(line => editor.removeLineClass(line, 'background', 'cm-line-modified'));
            highlightedLines = [];
            highlightTimer = null;
        }, 3500);
    }

    function computeDiffLines(orig, mod) {
        const o = orig.split('\n');
        const n = mod.split('\n');
        const oLen = o.length, nLen = n.length;
        const dp = Array(oLen + 1).fill(null).map(() => new Int32Array(nLen + 1));
        for (let i = oLen - 1; i >= 0; i--) {
            for (let j = nLen - 1; j >= 0; j--) {
                dp[i][j] = o[i] === n[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
            }
        }
        const changed = new Set();
        let i = 0, j = 0;
        while (i < oLen && j < nLen) {
            if (o[i] === n[j]) { i++; j++; }
            else { changed.add(j); j++; }
        }
        while (j < nLen) changed.add(j++);
        return Array.from(changed);
    }

    // ==================== Code Safety Check ====================
    // 共享：从 JS 代码中提取函数名集合（用于函数完整性检查）
    function extractFnNames(code) {
        const names = new Set();
        let m;
        const re1 = /function\s+(\w+)\s*\(/g;
        while ((m = re1.exec(code)) !== null) names.add(m[1]);
        const re2 = /(?:const|let|var)\s+(\w+)\s*=\s*(?:\([^)]*\)\s*=>|function)/g;
        while ((m = re2.exec(code)) !== null) names.add(m[1]);
        const re3 = /(?:^|\n)\s+(?:async\s+)?(\w+)\s*\([^)]*\)\s*\{/g;
        while ((m = re3.exec(code)) !== null) {
            if (!['if', 'for', 'while', 'switch', 'catch', 'constructor'].includes(m[1])) {
                names.add(m[1]);
            }
        }
        return names;
    }

    function checkCodeSafety(originalCode, modifiedCode, mode) {
        const introduced = (pattern) => pattern.test(modifiedCode) && !pattern.test(originalCode);
        const dangerous = [
            { re: /\beval\s*\(/i, message: '新增 eval() 动态执行，已阻止' },
            { re: /\bnew\s+Function\s*\(/i, message: '新增 Function 构造器动态执行，已阻止' },
            { re: /document\.write(?:ln)?\s*\(/i, message: '新增 document.write()，已阻止' },
            { re: /(?:setTimeout|setInterval)\s*\(\s*["']/i, message: '新增字符串形式的定时器执行，已阻止' },
            { re: /(?:href|src)\s*=\s*["']\s*javascript:/i, message: '新增 javascript: URL，已阻止' },
            { re: /(?:sk-[A-Za-z0-9_-]{20,}|Bearer\s+[A-Za-z0-9._-]{20,})/i, message: '修改内容疑似包含真实密钥或令牌，已阻止写入' }
        ];
        for (const rule of dangerous) {
            if (introduced(rule.re)) return { safe: false, reason: 'dangerous_code', message: rule.message, severity: 'error' };
        }
        const assetPolicy = validateAiManagedAssetPolicy(originalCode, modifiedCode);
        if (!assetPolicy.safe) return { safe: false, reason: 'managed_asset_policy', message: assetPolicy.reason, severity: 'error' };
        const origLen = originalCode.length;
        const modLen = modifiedCode.length;
        const origLines = originalCode.split('\n').length;
        const modLines = modifiedCode.split('\n').length;
        const ratio = modLen / Math.max(origLen, 1);

        // Rule 1: If code is drastically shortened, it's suspicious
        if (mode === 'full' && ratio < 0.4) {
            return {
                safe: false,
                reason: 'code_too_short',
                message: 'AI 返回的代码（' + modLines + ' 行）明显短于原始代码（' + origLines + ' 行），可能存在删减。请检查后再应用。',
                severity: 'warning'
            };
        }

        // Rule 2: For HTML, check if major structural tags are preserved
        if (currentLang === 'html') {
            const origTags = new Set();
            const modTags = new Set();
            const tagMatches = originalCode.match(/<([a-zA-Z][a-zA-Z0-9]*)[\s>]/g);
            if (tagMatches) tagMatches.forEach(t => origTags.add(t.slice(1).trim()));
            const modTagMatches = modifiedCode.match(/<([a-zA-Z][a-zA-Z0-9]*)[\s>]/g);
            if (modTagMatches) modTagMatches.forEach(t => modTags.add(t.slice(1).trim()));
            // Check if more than 50% of original tags are missing
            let missingTags = 0;
            origTags.forEach(t => { if (!modTags.has(t)) missingTags++; });
            if (origTags.size > 5 && missingTags / origTags.size > 0.5) {
                return {
                    safe: false,
                    reason: 'tags_missing',
                    message: 'AI 返回的代码丢失了大量原始标签（' + missingTags + ' 个），请检查是否意外删减。',
                    severity: 'warning'
                };
            }
        }

        // Rule 3: For JS, check if major function definitions are preserved
        if (currentLang === 'javascript') {
            const origFns = extractFnNames(originalCode);
            const modFns = extractFnNames(modifiedCode);
            let missingFns = 0;
            origFns.forEach(f => { if (!modFns.has(f)) missingFns++; });
            if (origFns.size > 3 && missingFns / origFns.size > 0.5) {
                return {
                    safe: false,
                    reason: 'functions_missing',
                    message: 'AI 返回的代码丢失了大量原始函数（' + missingFns + ' 个），请检查是否意外删减。',
                    severity: 'warning'
                };
            }
        }

        // Rule 4: HTML structural integrity check (applies to both full replace and from-scratch)
        if (currentLang === 'html' || mode === 'full') {
            const structuralIssues = checkHtmlStructuralIntegrity(modifiedCode);
            if (structuralIssues) return structuralIssues;
        }

        return { safe: true };
    }

    // Check HTML structural integrity: tag closure, <style>/<script> pairing, required tags
    function checkHtmlStructuralIntegrity(code) {
        // Only check if it looks like a full HTML document
        if (!/<html[\s>]/i.test(code) && !/<!DOCTYPE/i.test(code)) return null;

        const voidElements = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
        const tagStack = [];
        const tagRe = /<\/(\w+)[^>]*>|<(\w+)([^>]*)\/?>/g;
        let m;
        const mismatches = [];

        while ((m = tagRe.exec(code)) !== null) {
            if (m[1]) {
                // Closing tag
                const tag = m[1].toLowerCase();
                if (voidElements.has(tag)) continue;
                const last = tagStack[tagStack.length - 1];
                if (last && last.tag === tag) {
                    tagStack.pop();
                } else {
                    mismatches.push('未匹配的闭合标签 </' + tag + '>');
                    if (last) mismatches.push('（期望 </' + last.tag + '>）');
                }
            } else if (m[2]) {
                // Opening tag
                const tag = m[2].toLowerCase();
                if (voidElements.has(tag)) continue;
                const selfClosing = /\/$/.test(m[3]) || tag === 'script' && /<script[^>]*src=/.test(m[0]);
                if (!selfClosing) {
                    tagStack.push({ tag, line: code.substring(0, m.index).split('\n').length });
                }
            }
        }

        // Unclosed tags
        if (tagStack.length > 0) {
            const top = tagStack[tagStack.length - 1];
            const tagNames = tagStack.map(t => t.tag).join(', ');
            // Be lenient for common partial-edit scenarios, but strict for full documents
            if (tagStack.some(t => ['html', 'head', 'body', 'style', 'script'].includes(t.tag))) {
                return {
                    safe: false,
                    reason: 'unclosed_tags',
                    message: 'HTML 结构不完整：以下标签未闭合 → ' + tagNames + '。可能 AI 输出被截断或格式错误，请重试或手动检查。',
                    severity: 'error'
                };
            }
        }

        // Check <style> and <script> tag pairing specifically
        const styleOpen = (code.match(/<style[\s>]/gi) || []).length;
        const styleClose = (code.match(/<\/style>/gi) || []).length;
        if (styleOpen !== styleClose) {
            return {
                safe: false,
                reason: 'style_tag_mismatch',
                message: '<style> 标签不配对（开 ' + styleOpen + ' 个，闭 ' + styleClose + ' 个），CSS 会泄漏到页面文本中。',
                severity: 'error'
            };
        }
        const scriptOpen = (code.match(/<script[\s>]/gi) || []).length;
        const scriptClose = (code.match(/<\/script>/gi) || []).length;
        if (scriptOpen !== scriptClose) {
            return {
                safe: false,
                reason: 'script_tag_mismatch',
                message: '<script> 标签不配对（开 ' + scriptOpen + ' 个，闭 ' + scriptClose + ' 个），JS 可能无法正常执行。',
                severity: 'error'
            };
        }

        return null;
    }

    function renderThinkingSteps(thinkingText) {
        if (!thinkingText) return '<div class="thinking-step"><div class="thinking-step-content">AI 未输出结构化分析计划</div></div>';
        // Parse Chinese bracketed steps like 【问题理解】
        const stepRe = /【([^】]+)】/g;
        const steps = [];
        let m;
        while ((m = stepRe.exec(thinkingText)) !== null) { steps.push(m.index); }
        if (steps.length === 0) {
            // Fallback: split by blank lines
            return thinkingText.split(/\n\s*\n/).filter(s => s.trim()).map(para =>
                '<div class="thinking-step"><div class="thinking-step-content">' + escapeHtml(para.trim()) + '</div></div>'
            ).join('');
        }
        let html = '';
        for (let i = 0; i < steps.length; i++) {
            const start = steps[i];
            const end = steps[i + 1] !== undefined ? steps[i + 1] : thinkingText.length;
            const chunk = thinkingText.slice(start, end).trim();
            const titleMatch = chunk.match(/【([^】]+)】/);
            const title = titleMatch ? titleMatch[1] : '思考';
            const content = chunk.replace(/【[^】]+】/, '').trim();
            html += '<div class="thinking-step"><div class="thinking-step-title">' + escapeHtml(title) + '</div><div class="thinking-step-content">' + escapeHtml(content).replace(/\n/g, '<br>') + '</div></div>';
        }
        return html;
    }

    async function fetchModels() {
        const endpoint = aiEndpointInput.value.trim(); const apiKey = loadAiKey();
        if (!apiKey) { showToast('请先输入 API Key', ''); return; }
        const modelsUrl = getEndpointModelsUrl(endpoint);
        btnRefreshModels.classList.add('spinning'); btnRefreshModels.disabled = true;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        try {

                (agentModelCache?.imageModels?.length ? '（含图片生成）' : ''), '');
        } catch (err) {

    function addChatMessage(role, text, iconSvg) {
        const m = document.createElement('div');

    function sanitizeAssistantHtml(html) {
        if (typeof DOMPurify !== 'undefined') {
            return DOMPurify.sanitize(html, {
                USE_PROFILES: { html: true },
                FORBID_TAGS: ['script', 'style', 'iframe', 'object', 'embed', 'form', 'input', 'button', 'textarea', 'select', 'svg', 'math'],
                FORBID_ATTR: ['style', 'srcdoc']
            });
        }
        const template = document.createElement('template');
        template.innerHTML = html;
        const allowed = new Set(['P','BR','STRONG','EM','DEL','CODE','PRE','BLOCKQUOTE','UL','OL','LI','H1','H2','H3','H4','H5','H6','A','HR','TABLE','THEAD','TBODY','TR','TH','TD','SPAN']);
        template.content.querySelectorAll('*').forEach(el => {
            if (!allowed.has(el.tagName)) { el.replaceWith(document.createTextNode(el.textContent || '')); return; }
            [...el.attributes].forEach(attr => {
                const name = attr.name.toLowerCase();
                if (el.tagName === 'A' && name === 'href') {
                    try { const u = new URL(attr.value, location.href); if (!['http:','https:','mailto:'].includes(u.protocol)) el.removeAttribute(attr.name); }
                    catch (_) { el.removeAttribute(attr.name); }
                } else if (!(el.tagName === 'A' && ['title','target','rel'].includes(name)) && name !== 'class') {
                    el.removeAttribute(attr.name);
                }
            });
            if (el.tagName === 'A') { el.setAttribute('rel', 'noopener noreferrer'); el.setAttribute('target', '_blank'); }
        });
        return template.innerHTML;
    }

    function renderAssistantText(textSpan, text) {

            const code = document.createElement('code');
            code.className = 'language-json';
            code.textContent = json;
            pre.appendChild(code);
            textSpan.appendChild(pre);
            if (typeof hljs !== 'undefined') {
                try { hljs.highlightElement(code); } catch (e) { console.warn('[Werkstatt] hljs highlight failed:', e.message); }
            }
        } else {
            try {
                const html = marked.parse(text);
                textSpan.innerHTML = sanitizeAssistantHtml(html);
            } catch (e) { textSpan.textContent = text; }
        }
    }
